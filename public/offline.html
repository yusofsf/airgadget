<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#17212b">
    <title>ایرگجت | آفلاین</title>
    <style>
        *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#fbfbfc;color:#17212b;font-family:Tahoma,Arial,sans-serif}.offline{width:min(430px,100%);text-align:center;background:#fff;border:1px solid #e6ebee;border-radius:24px;padding:38px;box-shadow:0 20px 60px #17212b12}.offline img{width:112px;height:112px;object-fit:contain;border-radius:28px}.offline h1{font-size:24px;margin:22px 0 10px}.offline p{color:#68757f;font-size:14px;line-height:2}.offline button{margin-top:12px;border:0;border-radius:10px;background:#ee6a42;color:#fff;padding:12px 20px;font:inherit;cursor:pointer}
    </style>
</head>
<body>
    <main class="offline">
        <img src="/pwa/icon-192.png" alt="ایرگجت">
        <h1>ارتباط اینترنت برقرار نیست</h1>
        <p>برای مشاهده محصولات و ثبت سفارش، اتصال اینترنت را بررسی کنید و دوباره تلاش کنید.</p>
        <button type="button" onclick="window.location.reload()">تلاش دوباره</button>
    </main>
</body>
</html>
